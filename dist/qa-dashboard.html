<title>商家分层运营大屏</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* QuickAudience 商家分层运营大屏 · 深色主题
   配色取自 dataviz 校验通过的调色板（见 docs/大屏模块与字段设计.md） */
:root {
  --page: #0d1016;
  --surface: #141821;
  --surface-2: #191e28;
  --line: #232936;
  --baseline: #2e3547;

  --ink: #ffffff;
  --ink-2: #c9ced9;
  --ink-3: #868d9c;

  --s1: #3987e5;   /* 短信 */
  --s2: #d95926;   /* AI外呼 */
  --s3: #199e70;   /* Push及企微 */

  --t1: #86b6ef;   /* SKA */
  --t2: #3987e5;   /* KA */
  --t3: #256abf;   /* 腰部 */
  --t4: #184f95;   /* 基础长尾 */
  --t5: #d55181;   /* 新客观察期 */
  --t6: #898781;   /* 未激活 */

  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶部 ---------- */
.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 14px 24px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #151b26, var(--page));
  position: sticky; top: 0; z-index: 20;
}
.brand { font-size: 17px; font-weight: 650; letter-spacing: .4px; }
.brand small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.tab {
  padding: 7px 14px; border-radius: 7px; cursor: pointer; color: var(--ink-2);
  border: 1px solid transparent; font-size: 13px; white-space: nowrap;
  background: none; font-family: inherit;
}
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab.on { background: rgba(57,135,229,.16); border-color: rgba(57,135,229,.5); color: #cfe1fa; }
.tab .badge {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 9px;
  font-size: 11px; background: var(--critical); color: #fff; font-variant-numeric: tabular-nums;
}

/* ---------- 筛选行（唯一一行，作用于全部图表） ---------- */
.filters {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start;
  padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.fgroup { display: flex; flex-direction: column; gap: 5px; }
.fgroup > label { font-size: 11px; color: var(--ink-3); letter-spacing: .3px; }
.chiprow { display: flex; gap: 5px; }
.chip {
  padding: 5px 11px; border-radius: 6px; font-size: 12px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  font-family: inherit;
}
.chip:hover { border-color: var(--baseline); color: var(--ink); }
.chip.on { background: rgba(57,135,229,.18); border-color: rgba(57,135,229,.55); color: #cfe1fa; }
select, input[type=text], input[type=search] {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 6px; padding: 6px 9px; font-size: 12px; font-family: inherit; min-width: 108px;
}
select[multiple] { height: 58px; padding: 3px 6px; }
select:focus, input:focus { outline: 2px solid rgba(57,135,229,.6); outline-offset: 0; }
.spacer { margin-left: auto; }
.hint { font-size: 11px; color: var(--ink-3); align-self: flex-end; padding-bottom: 7px; }

/* ---------- 栅格 ---------- */
main { padding: 16px 24px 40px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px 16px; min-width: 0;
}
.card > h3 {
  margin: 0 0 2px; font-size: 13.5px; font-weight: 600; letter-spacing: .2px;
  display: flex; align-items: baseline; gap: 8px;
}
.card > h3 .sub { font-size: 11px; color: var(--ink-3); font-weight: 400; }
.chart { width: 100%; height: 268px; margin-top: 8px; }
.chart.tall { height: 340px; }
.chart.short { height: 200px; }

.c3 { grid-column: span 3; } .c4 { grid-column: span 4; }
.c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; }
.c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
@media (max-width: 1400px) {
  .c3, .c4, .c5 { grid-column: span 6; }
  .c7, .c8, .c9 { grid-column: span 12; }
}
@media (max-width: 900px) { .grid > * { grid-column: span 12 !important; } }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; grid-column: span 12; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 16px 14px; position: relative; overflow: hidden;
}
.kpi .label { font-size: 12px; color: var(--ink-3); }
.kpi .value { font-size: 27px; font-weight: 650; margin-top: 3px; letter-spacing: -.4px; }
.kpi.hero { grid-column: span 2; }
.kpi.hero .value { font-size: 50px; line-height: 1.05; }
.kpi .unit { font-size: 14px; color: var(--ink-2); margin-left: 4px; font-weight: 400; }
.kpi .foot { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; display: flex; gap: 10px; align-items: center; }
.delta { font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good); } .delta.down { color: var(--critical); }
.spark { position: absolute; right: 12px; bottom: 8px; width: 130px; height: 40px; opacity: .9; }

/* ---------- 表格 ---------- */
.tablewrap { overflow: auto; max-height: 560px; margin-top: 10px; }
.tablewrap.short { max-height: 360px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 8px 10px; text-align: left; white-space: nowrap; }
th {
  color: var(--ink-3); font-weight: 500; font-size: 11.5px; border-bottom: 1px solid var(--baseline);
  position: sticky; top: 0; background: var(--surface);
}
td { border-bottom: 1px solid var(--line); }
tbody tr:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 11px;
  font-size: 11.5px; border: 1px solid transparent;
}
.pill.lv-高危 { background: rgba(208,59,59,.16); color: #f3a1a1; border-color: rgba(208,59,59,.45); }
.pill.lv-中危 { background: rgba(236,131,90,.15); color: #f0b298; border-color: rgba(236,131,90,.4); }
.pill.lv-关注 { background: rgba(250,178,25,.14); color: #f2ce85; border-color: rgba(250,178,25,.38); }
.pill.lv-正常 { background: rgba(12,163,12,.13); color: #86d386; border-color: rgba(12,163,12,.35); }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); margin-right: 4px;
}
.btn {
  padding: 5px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit;
  background: rgba(57,135,229,.18); border: 1px solid rgba(57,135,229,.5); color: #cfe1fa;
}
.btn:hover { background: rgba(57,135,229,.3); }
.btn.ghost { background: var(--surface-2); border-color: var(--line); color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- 动作卡片 ---------- */
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; margin-top: 10px; }
.act {
  background: var(--surface-2); border: 1px solid var(--line); border-left-width: 3px;
  border-radius: 8px; padding: 12px 13px;
}
.act.lv-高危 { border-left-color: var(--critical); }
.act.lv-中危 { border-left-color: var(--serious); }
.act.lv-关注 { border-left-color: var(--warn); }
.act .top { display: flex; align-items: center; gap: 8px; }
.act .name { font-weight: 600; font-size: 13.5px; }
.act .why { color: var(--ink-2); font-size: 12px; margin: 7px 0 4px; }
.act .do { font-size: 12.5px; color: var(--ink); }
.act .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 9px; font-size: 11.5px; color: var(--ink-3); }
.act .meta b { color: var(--ink-2); font-weight: 500; font-variant-numeric: tabular-nums; }

pre.card-json {
  background: #0a0d13; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
  font-size: 11.5px; line-height: 1.5; color: #b7c4d6; max-height: 340px; overflow: auto;
  margin: 8px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.toast {
  position: fixed; right: 22px; bottom: 22px; z-index: 60; max-width: 420px;
  background: var(--surface-2); border: 1px solid var(--baseline); border-radius: 9px;
  padding: 12px 15px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.toast.err { border-color: rgba(208,59,59,.6); }
.loading { opacity: .45; transition: opacity .15s; }
.empty { color: var(--ink-3); padding: 26px 0; text-align: center; font-size: 12.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.note { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; line-height: 1.6; }

/* 网页版增补：字体、数据说明弹层、飞书卡片弹层 */

body {
  font-family: 'IBM Plex Sans', system-ui, -apple-system, 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
.brand { font-weight: 600; }
/* 需要竖向对齐的数字才用等宽，独立大数字保持比例字形 */
td.num, th.num, .act .meta b, .delta, .tag { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.kpi .value, .card > h3 { font-feature-settings: 'ss02'; }
pre.card-json { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

.topnote {
  margin-left: 18px; padding: 4px 10px; border-radius: 6px; font-size: 11.5px;
  background: rgba(57,135,229,.12); border: 1px solid rgba(57,135,229,.35);
  color: #a9c8ee; cursor: pointer; font-family: inherit;
}
.topnote:hover { background: rgba(57,135,229,.22); }

.modal {
  position: fixed; inset: 0; z-index: 80; display: flex; align-items: center;
  justify-content: center; background: rgba(6,8,12,.72); padding: 28px;
}
.modal .box {
  background: var(--surface); border: 1px solid var(--baseline); border-radius: 12px;
  max-width: 780px; width: 100%; max-height: 84vh; overflow: auto; padding: 20px 22px 22px;
  box-shadow: 0 24px 70px rgba(0,0,0,.6);
}
.modal h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.modal .lead { color: var(--ink-2); font-size: 12.5px; margin: 0 0 14px; line-height: 1.7; }
.modal h4 { margin: 16px 0 6px; font-size: 12.5px; color: var(--ink); font-weight: 600; }
.modal p, .modal li { color: var(--ink-2); font-size: 12.5px; line-height: 1.75; margin: 4px 0; }
.modal ul { margin: 4px 0; padding-left: 18px; }
.modal .close { float: right; }
.modal pre.card-json { white-space: pre-wrap; word-break: break-all; }
.modal code {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 1px 5px; font-size: 11.5px; font-family: 'IBM Plex Mono', ui-monospace, monospace;
}

</style>

<header class="topbar">
  <div class="brand">QuickAudience 商家分层运营大屏
    <small>商家运营负责人视角 · 分层 / 通道 / 预警 / 动作提醒</small></div>
  <button class="topnote" id="aboutBtn">数据说明</button>
  <nav class="tabs" id="tabs">

</header>

<section class="filters" id="filters">
  <div class="fgroup">
    <label>统计时间段</label>

      <button class="chip" data-n="1">近1月</button>

  <div class="fgroup"><label>起始月</label><select id="startSel"></select></div>

  <div class="fgroup"><label>合同类型</label><select id="contractSel"><option value="">全部</option></select></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<script>
/* 网页版增补：ECharts 字体主题、数据说明弹层、飞书卡片弹层 */

const UI_FONT = "'IBM Plex Sans', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
echarts.registerTheme('qa', { textStyle: { fontFamily: UI_FONT } });
const _echartsInit = echarts.init;
echarts.init = (dom, theme, opts) => _echartsInit(dom, theme || 'qa', opts);

function closeModal() { document.querySelector('.modal')?.remove(); }

function openModal(html) {
  closeModal();
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="box">${html}</div>`;
  d.addEventListener('click', e => { if (e.target === d) closeModal(); });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', esc); }
  });
  document.body.appendChild(d);
  d.querySelector('.close')?.addEventListener('click', closeModal);
}

/* 网页版点「推送」后展示与线上一致的飞书报文 */
function showCard(card, count, recipients) {
  openModal(`
    <button class="btn ghost close">关闭</button>
    <h2>飞书消息卡片</h2>
    <p class="lead">${count} 条动作 · 收件销售 ${recipients.join('、')}</p>
    <p>网页版没有服务端，无法直接向飞书发起请求，因此这里只生成报文。把下面的 JSON
       贴进飞书机器人调试台即可原样发出；Flask 版配置 <code>FEISHU_WEBHOOK</code> 后是真实推送。</p>
    <pre class="card-json" style="max-height:46vh">${esc(JSON.stringify(card, null, 2))}</pre>`);
}

const ABOUT = `
  <button class="btn ghost close">关闭</button>
  <h2>这份大屏的数据是怎么来的</h2>
  <p class="lead">数据源：QuickAudience 商家分层练习工作簿「商家明细」sheet，2000 家模拟商家、47 个字段。</p>

  <h4>月度数据是推算的</h4>
  <p>原表只有<b>近 12 个月的汇总消耗</b>，没有月度明细，所以「筛选时间段」在原始数据上做不了。
     ETL 把每家每通道的年度总额确定性地展开成 12 个月，权重全部由表内已有字段驱动：</p>
  <ul>
    <li><b>近3月消耗环比趋势</b> 决定尾部三个月的斜率（上升 / 持平 / 下降 / 连续下降）</li>
    <li><b>近12月大促参与次数</b> 决定 1 月年货节、6 月 618、11 月双 11 的脉冲强度</li>
    <li><b>签约时间</b> 之前的月份消耗恒为 0，再在可用月份上归一化</li>
    <li><b>商家ID 哈希</b> 作固定种子，每次运行结果完全一致</li>
  </ul>
  <p>满 12 月窗口的合计严格等于原表总额 ¥190,743,600。</p>

  <h4>销售负责人是派生的</h4>
  <p>原表没有这个字段，按「所在区域 + 商家ID 哈希」分配到 14 名虚拟销售，仅用于演示飞书通知的收件路由。</p>

  <h4>分层口径</h4>
  <p><b>区间重算</b>：把区间消耗年化后套打分卡档界，重算价值 / 活跃 / 潜力 / 健康四维分与综合分，再按
     SKA≥90、KA 75–90、腰部 40–75、基础长尾&lt;40 映射；区间零消耗的按合作月数分流到新客观察期 / 未激活。
     <b>年度基准</b>：直接用工作簿公式列的结果。</p>
  <p>满 12 个月窗口下，区间重算结果与工作簿公式完全一致（SKA 26 / KA 121 / 腰部 695 / 基础长尾 528 /
     新客观察期 4 / 未激活 626），可作为口径复刻正确性的回归基准。</p>

  <h4>网页版与 Flask 版的差别</h4>
  <p>这个页面把服务端的聚合逻辑搬到了浏览器，全部筛选、分层重算、预警和动作生成都在本地跑，
     结果与 Flask 版一致。唯一的差别是飞书推送：网页版只生成报文，不外发。</p>`;

document.addEventListener('click', e => {
  if (e.target.id === 'aboutBtn') openModal(ABOUT);
});

  seq: ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b']
};
const LEVEL_ICON = { '高危': '▲', '中危': '◆', '关注': '●', '正常': '✓' };

/* ---------- 格式化 ---------- */
const fmtInt = n => (n == null ? '–' : Math.round(n).toLocaleString('zh-CN'));
function fmtMoney(n) {
  if (n == null) return '–';
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
  if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1) + ' 万';
  return Math.round(n).toLocaleString('zh-CN');
}
const fmtYuan = n => '¥' + fmtMoney(n);
const fmtPct = (n, d = 1) => (n == null ? '–' : (n * 100).toFixed(d) + '%');
function deltaHtml(d, goodUp = true) {
  if (d == null) return '<span class="delta">环比 –</span>';
  const up = d >= 0, good = up === goodUp;
  return `<span class="delta ${good ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(d * 100).toFixed(1)}% 环比</span>`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- 筛选状态 ---------- */
const state = {
  start: null, end: null, rescore: '1',
  industry: [], region: [], source: '', contract: '', tier: '', strategic: '',
  detailPage: 1, detailSort: 'spend', detailQ: '', detailAlertOnly: false,
  alertLevel: '', alertRule: '', actionLevel: '', actionOwner: ''
};
let META = null;

/* ---------- ECharts 基础配置 ---------- */
const charts = new Map();
function chart(id, option, height) {
  const el = document.getElementById(id);
  if (!el) return;
  if (height) el.style.height = height;
  let inst = charts.get(id);
  if (!inst || inst.getDom() !== el) { inst && inst.dispose(); inst = echarts.init(el, null, { renderer: 'canvas' }); charts.set(id, inst); }
  inst.setOption(option, true);
  return inst;
}
window.addEventListener('resize', () => charts.forEach(c => c.resize()));

const axisLabel = { color: C.ink3, fontSize: 11 };
const axisLine = { lineStyle: { color: C.baseline } };
const splitLine = { lineStyle: { color: C.line, type: 'solid', width: 1 } };
const tooltipBase = {
  backgroundColor: '#10141c', borderColor: C.baseline, borderWidth: 1,
  textStyle: { color: C.ink2, fontSize: 12 }, padding: [8, 11], confine: true
};
const legendBase = {
  textStyle: { color: C.ink2, fontSize: 11.5 }, itemWidth: 10, itemHeight: 10,
  icon: 'roundRect', top: 0, right: 0
};
const gridBase = { left: 8, right: 16, top: 34, bottom: 6, containLabel: true };

/* 值轴：单位统一为万元，避免坐标轴长数字 */
const moneyAxis = (name = '消耗（万元）') => ({
  type: 'value', name, nameTextStyle: { color: C.ink3, fontSize: 11, align: 'left' },
  axisLabel: { ...axisLabel, formatter: v => (v / 1e4).toLocaleString('zh-CN') },
  axisLine: { show: false }, axisTick: { show: false }, splitLine
});
const catAxis = (data, opt = {}) => ({
  type: 'category', data, axisLabel, axisLine, axisTick: { show: false }, ...opt
});

/* 柱条统一规格：≤24px、数据端 4px 圆角、堆叠间留 2px 面色缝 */
const BAR = { barMaxWidth: 22, itemStyle: { borderRadius: [4, 4, 0, 0] } };
const BAR_H = { barMaxWidth: 18, itemStyle: { borderRadius: [0, 4, 4, 0] } };
const STACK_GAP = { borderColor: C.surface, borderWidth: 2 };

function sparkOption(data, color = C.tier.KA) {
  return {
    animation: false, grid: { left: 0, right: 0, top: 2, bottom: 2 },
    xAxis: { type: 'category', show: false, data: data.map((_, i) => i), boundaryGap: false },
    yAxis: { type: 'value', show: false, min: v => v.min * 0.85 },
    series: [{
      type: 'line', data, smooth: 0.35, symbol: 'none',
      lineStyle: { width: 2, color }, areaStyle: { color, opacity: 0.10 }
    }]
  };
}

/* ---------- 小工具 ---------- */
function toast(msg, isErr = false) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div');
  d.className = 'toast' + (isErr ? ' err' : '');
  d.innerHTML = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 5200);
}
const tierSwatch = t => `<span class="swatch" style="background:${C.tier[t] || C.ink3}"></span>${esc(t)}`;
const levelPill = lv => `<span class="pill lv-${lv}">${LEVEL_ICON[lv]} ${lv}</span>`;

<script>
/* 网页版数据层：把服务端 metrics / alerts / actions 三层搬到浏览器。
   对外暴露与 Flask 版完全相同的 api(path, extra) 契约，因此 views.js 无需改动。 */

const D = QA_DATA;
const MONTHS_ALL = D.months, CH = D.channels, TIER_ORDER = D.tiers;
const DICT = D.dict;

const MER = D.m.map((r, i) => ({
  idx: i, id: r[0], name: r[1],
  industry: DICT.industry[r[2]], region: DICT.region[r[3]],
  source: DICT.source[r[4]], contract: DICT.contract[r[5]],
  lifecycle: DICT.lifecycle[r[6]], strategic: r[7] ? '是' : '否',
  coop: r[8], trendTxt: DICT.trend[r[9]],
  scene: r[10], depth: r[11], activeDays: r[12],
  bScene: r[13], bDepth: r[14], bSend: r[15], bDays: r[16], bMember: r[17],
  bBudget: r[18], bPromo: r[19], bTeam: r[20], bTrend: r[21], bRenew: r[22],
  budget: r[23], baseTier: TIER_ORDER[r[24]], baseScore: r[25], owner: DICT.owner[r[26]],
  baseV: r[27], baseA: r[28], baseP: r[29], baseH: r[30],
  ch: D.c[i] || null                       // [[12 短信],[12 外呼],[12 Push企微]] 或 null
}));

/* 打分卡档界与分层映射，与 app/metrics.py 保持同一份口径 */
const SPEND_BANDS = [0, 24000, 94000, 220000, 530000];
const TIER_CUTS = [['基础长尾', 0], ['腰部', 40], ['KA', 75], ['SKA', 90]];
const STRATEGY = {
  'SKA': '守·共创：卡片短信/AI外呼新场景POC',
  'KA': '扩·深化：AI外呼场景深化+Push/企微补全',
  '腰部': '拉·主攻：主推AI外呼+大促作战包',
  '基础长尾': '激活：企微+Push低成本先跑',
  '新客观察期': '培育：入门包+1v1场景教育',
  '未激活': '唤醒：短信模板+首充补贴'
};

function bandScore(v) {
  let s = 0;
  for (const b of SPEND_BANDS) if (v >= b) s++;
  return Math.min(5, Math.max(1, s));
}
const sum = a => a.reduce((x, y) => x + y, 0);
const pctDelta = (cur, prev) => (prev ? (cur - prev) / prev : null);

/* ---------------------------------------------------------------- 上下文构建 */
function buildCtx(st) {
  const a = MONTHS_ALL.indexOf(st.start || MONTHS_ALL[0]);
  const b = MONTHS_ALL.indexOf(st.end || MONTHS_ALL[MONTHS_ALL.length - 1]);
  const lo = Math.min(a, b), hi = Math.max(a, b);
  const n = hi - lo + 1;
  const months = MONTHS_ALL.slice(lo, hi + 1);
  const pLo = Math.max(0, lo - n), pHi = lo - 1;

  const rescore = st.rescore !== '0';
  const rows = [];

  for (const m of MER) {
    const cur = [0, 0, 0], prev = [0, 0, 0];
    const monthly = new Array(n).fill(0);
    if (m.ch) {
      for (let c = 0; c < 3; c++) {
        const arr = m.ch[c];
        for (let i = lo; i <= hi; i++) { cur[c] += arr[i]; monthly[i - lo] += arr[i]; }
        for (let i = pLo; i <= pHi; i++) prev[c] += arr[i];
      }
    }
    const spend = cur[0] + cur[1] + cur[2];
    const annual = spend * (12 / n);

    let v, act, p, h, total, tier;
    if (rescore) {
      const sb = bandScore(annual);
      v = (25 * sb + 8 * m.bScene + 7 * m.bDepth) / 5;
      act = (10 * m.bSend + 10 * m.bDays) / 5;
      p = (12 * m.bMember + 8 * m.bBudget + 6 * m.bPromo + 4 * m.bTeam) / 5;
      h = (6 * m.bTrend + 4 * m.bRenew) / 5;
      if (m.coop < 3) v = p / 30 * 40;                  // 新客修正：看潜力不看消耗
      total = Math.round((v + act + p + h) * 10) / 10;

      tier = '基础长尾';
      for (const [name, cut] of TIER_CUTS) if (total >= cut) tier = name;
      if (spend <= 0) tier = m.coop < 3 ? '新客观察期' : '未激活';   // 一票否决
    } else {
      // 年度基准口径：四维分与分层直接取工作簿公式列，不随窗口变化
      v = m.baseV; act = m.baseA; p = m.baseP; h = m.baseH;
      total = m.baseScore; tier = m.baseTier;
    }

    rows.push({
      m, spend, cur, prev, monthly,
      prevSpend: prev[0] + prev[1] + prev[2],
      v: Math.round(v * 10) / 10, a: Math.round(act * 10) / 10,
      p: Math.round(p * 10) / 10, h: Math.round(h * 10) / 10,
      score: total, tier, strategy: STRATEGY[tier],
      headroom: Math.max(0, m.budget - annual),
      last: n >= 1 ? monthly[n - 1] : 0,
      prev1: n >= 2 ? monthly[n - 2] : 0
    });
  }

  const f = st.filters || {};
  const keep = r =>
    (!f.industry?.length || f.industry.includes(r.m.industry)) &&
    (!f.region?.length || f.region.includes(r.m.region)) &&
    (!f.source || f.source === r.m.source) &&
    (!f.contract || f.contract === r.m.contract) &&
    (!f.tier || f.tier === r.tier) &&
    (!f.strategic || f.strategic === r.m.strategic);

  return { rows: rows.filter(keep), months, n };
}

/* ---------------------------------------------------------------- M1 总览 */
function kpi(ctx) {
  const R = ctx.rows;
  const spend = sum(R.map(r => r.spend));
  const active = R.filter(r => r.spend > 0).length;
  const head = sum(R.filter(r => r.tier === 'SKA' || r.tier === 'KA').map(r => r.spend));
  const prevSpend = sum(R.map(r => r.prevSpend));
  const prevActive = R.filter(r => r.prevSpend > 0).length;
  const trend = ctx.months.map((_, i) => sum(R.map(r => r.monthly[i])));
  return {
    merchants: R.length, active, active_delta: pctDelta(active, prevActive),
    spend, spend_delta: pctDelta(spend, prevSpend), spend_trend: trend,
    arpu: active ? spend / active : 0,
    dormant: R.filter(r => r.spend <= 0 && r.m.coop >= 3).length,
    head_share: spend ? head / spend : 0,
    avg_scene: R.length ? sum(R.map(r => r.m.scene)) / R.length : 0,
    months: ctx.months
  };
}

function trendByChannel(ctx) {
  return {
    months: ctx.months,
    series: CH.map((c, ci) => ({
      name: c,
      data: ctx.months.map((_, i) => {
        const lo = MONTHS_ALL.indexOf(ctx.months[0]);
        return sum(ctx.rows.map(r => (r.m.ch ? r.m.ch[ci][lo + i] : 0)));
      })
    }))
  };
}

function tierSummary(ctx) {
  const R = ctx.rows, total = sum(R.map(r => r.spend));
  return TIER_ORDER.map(t => {
    const s = R.filter(r => r.tier === t);
    const sp = sum(s.map(r => r.spend));
    return {
      tier: t, count: s.length, count_share: R.length ? s.length / R.length : 0,
      spend: sp, spend_share: total ? sp / total : 0,
      avg_score: s.length ? sum(s.map(r => r.score)) / s.length : 0,
      avg_scene: s.length ? sum(s.map(r => r.m.scene)) / s.length : 0,
      strategy: STRATEGY[t]
    };
  });
}

function lorenz(ctx) {
  const s = ctx.rows.map(r => r.spend).sort((a, b) => b - a);
  const tot = sum(s);
  if (!s.length || tot <= 0) return { points: [], top10: 0 };
  const cum = []; let acc = 0;
  for (const v of s) { acc += v; cum.push(acc / tot); }
  const nn = s.length, step = Math.max(1, Math.floor(nn / 120));
  const pts = [];
  for (let i = 0; i < nn; i += step)
    pts.push([+(((i + 1) / nn) * 100).toFixed(2), +(cum[i] * 100).toFixed(2)]);
  if (pts[pts.length - 1][0] < 100) pts.push([100, 100]);
  return { points: pts, top10: cum[Math.max(0, Math.floor(nn * 0.1) - 1)] };
}

function byDimension(ctx, key, top) {
  const g = new Map();
  for (const r of ctx.rows) {
    const k = r.m[key];
    const e = g.get(k) || { name: k, spend: 0, count: 0 };
    e.spend += r.spend; e.count++; g.set(k, e);
  }
  const out = [...g.values()].sort((a, b) => b.spend - a.spend);
  return top ? out.slice(0, top) : out;
}

/* ---------------------------------------------------------------- M2 分层 */
function tierIndustryMatrix(ctx) {
  const inds = [...new Set(ctx.rows.map(r => r.m.industry))].sort();
  const grid = TIER_ORDER.map(() => inds.map(() => 0));
  for (const r of ctx.rows) {
    const ti = TIER_ORDER.indexOf(r.tier), ii = inds.indexOf(r.m.industry);
    if (ti >= 0 && ii >= 0) grid[ti][ii]++;
  }
  const data = [];
  let mx = 0;
  for (let i = 0; i < TIER_ORDER.length; i++)
    for (let j = 0; j < inds.length; j++) { data.push([j, i, grid[i][j]]); mx = Math.max(mx, grid[i][j]); }
  return { industries: inds, tiers: TIER_ORDER, data, max: mx };
}

function quadrant(ctx, limit = 800) {
  const R = ctx.rows.filter(r => r.tier !== '未激活');
  const sorted = R.map(r => r.spend).sort((a, b) => a - b);
  const med = sorted.length
    ? (sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
       : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2) : 0;

  const isNew = r => r.m.coop < 6 && r.spend <= med && r.p >= 24;
  const isDecay = r => (r.tier === 'SKA' || r.tier === 'KA') && r.m.trendTxt === '连续下降';

  const groups = {
    '常规': R.filter(r => !isNew(r) && !isDecay(r)),
    '高潜新签': R.filter(r => isNew(r) && !isDecay(r)),
    '衰退KA': R.filter(isDecay)
  };
  const out = {}, counts = {};
  for (const [name, arr] of Object.entries(groups)) {
    counts[name] = arr.length;
    let a = arr;
    if (name === '常规' && a.length > limit)
      a = [...a].sort((x, y) => y.spend - x.spend).slice(0, limit);
    out[name] = a.map(r => [r.p, r.v, r.spend, r.m.name, r.tier]);
  }
  return { groups: out, counts };
}

function lifecycle(ctx) {
  const order = ['潜客试用', '首次订购客户', '增购客户', '续订客户', '流失预警', '已流失'];
  return order.map(k => {
    const s = ctx.rows.filter(r => r.m.lifecycle === k);
    return s.length ? { name: k, count: s.length, spend: sum(s.map(r => r.spend)) } : null;
  }).filter(Boolean);
}

function tierRadar(ctx) {
  return TIER_ORDER.slice(0, 4).map(t => {
    const s = ctx.rows.filter(r => r.tier === t);
    if (!s.length) return null;
    const avg = k => Math.round(sum(s.map(r => r[k])) / s.length * 10) / 10;
    return { tier: t, value: [avg('v'), avg('a'), avg('p'), avg('h')] };
  }).filter(Boolean);
}

function migration(ctx, limit = 60) {
  const rank = Object.fromEntries(TIER_ORDER.map((t, i) => [t, i]));
  return ctx.rows.filter(r => r.tier !== r.m.baseTier)
    .sort((a, b) => b.spend - a.spend).slice(0, limit)
    .map(r => ({
      id: r.m.id, name: r.m.name, from: r.m.baseTier, to: r.tier,
      direction: rank[r.tier] < rank[r.m.baseTier] ? '升级' : '降级',
      score: r.score, base_score: r.m.baseScore, spend: r.spend, owner: r.m.owner
    }));
}

/* ---------------------------------------------------------------- M3 通道 */
function channelSummary(ctx) {
  const R = ctx.rows;
  const total = sum(R.map(r => r.spend));
  const lo = MONTHS_ALL.indexOf(ctx.months[0]);
  return CH.map((c, ci) => {
    const cur = sum(R.map(r => r.cur[ci]));
    const users = R.filter(r => r.cur[ci] > 0).length;
    const prev = sum(R.map(r => r.prev[ci]));
    const trend = ctx.months.map((_, i) => sum(R.map(r => (r.m.ch ? r.m.ch[ci][lo + i] : 0))));
    return {
      channel: c, spend: cur, share: total ? cur / total : 0, users,
      penetration: R.length ? users / R.length : 0,
      arpu: users ? cur / users : 0, delta: pctDelta(cur, prev), trend
    };
  });
}

function tierChannelMix(ctx) {
  const tiers = TIER_ORDER.filter(t => sum(ctx.rows.filter(r => r.tier === t).map(r => r.spend)) > 0);
  return {
    tiers,
    series: CH.map((c, ci) => ({
      name: c,
      data: tiers.map(t => {
        const s = ctx.rows.filter(r => r.tier === t);
        const tot = sum(s.map(r => r.spend));
        return tot ? Math.round(sum(s.map(r => r.cur[ci])) / tot * 1000) / 10 : 0;
      })
    }))
  };
}

function tierChannelPenetration(ctx) {
  const tiers = TIER_ORDER.filter(t => ctx.rows.some(r => r.tier === t));
  return {
    tiers,
    series: CH.map((c, ci) => ({
      name: c,
      data: tiers.map(t => {
        const s = ctx.rows.filter(r => r.tier === t);
        return s.length ? Math.round(s.filter(r => r.cur[ci] > 0).length / s.length * 1000) / 10 : 0;
      })
    }))
  };
}

function sceneDepth(ctx) {
  const tiers = TIER_ORDER.filter(t => ctx.rows.some(r => r.tier === t));
  const avg = (t, k) => {
    const s = ctx.rows.filter(r => r.tier === t);
    return s.length ? Math.round(sum(s.map(r => r.m[k])) / s.length * 100) / 100 : 0;
  };
  return { tiers, scene: tiers.map(t => avg(t, 'scene')), depth: tiers.map(t => avg(t, 'depth')) };
}

/* ---------------------------------------------------------------- M5 预警 */
const RULES = [
  ['连续下降', '高危', '近3月消耗环比连续下降'],
  ['消耗断崖', '高危', '最近1月低于区间月均 40% 以上'],
  ['头部流失预警', '高危', 'SKA/KA 且生命周期=流失预警'],
  ['活跃衰减', '中危', '月均活跃发送天数 <5 天'],
  ['场景收缩', '中危', '触达场景数 ≤1 且分层在腰部及以上'],
  ['预算未消化', '关注', '可拓展预算空间占年度预算 >80%'],
  ['沉默超期', '关注', '区间零消耗且合作 ≥3 个月']
];
const RULE_LEVEL = Object.fromEntries(RULES.map(r => [r[0], r[1]]));
const RULE_DESC = Object.fromEntries(RULES.map(r => [r[0], r[2]]));
const LEVEL_ORDER = ['高危', '中危', '关注'];
const LEVEL_RANK = { '高危': 0, '中危': 1, '关注': 2 };
const RISK_WEIGHT = { '高危': 1, '中危': 0.5, '关注': 0.2, '正常': 0 };

function evaluateAlerts(ctx) {
  for (const r of ctx.rows) {
    const avg = r.spend / ctx.n;
    const hit = {
      '连续下降': r.m.trendTxt === '连续下降',
      '消耗断崖': avg > 10000 && r.last < avg * 0.6,
      '头部流失预警': (r.tier === 'SKA' || r.tier === 'KA') && r.m.lifecycle === '流失预警',
      '活跃衰减': r.m.activeDays < 5 && r.spend > 0,
      '场景收缩': r.m.scene <= 1 && ['SKA', 'KA', '腰部'].includes(r.tier),
      '预算未消化': r.headroom > r.m.budget * 0.8 && r.m.budget > 1e6,
      '沉默超期': r.spend <= 0 && r.m.coop >= 3
    };
    r.hit = hit;
    r.rules = RULES.map(x => x[0]).filter(k => hit[k]);
    r.level = r.rules.length
      ? r.rules.map(k => RULE_LEVEL[k]).sort((a, b) => LEVEL_RANK[a] - LEVEL_RANK[b])[0]
      : '正常';
    r.exposure = r.spend * RISK_WEIGHT[r.level];
  }
  return ctx;
}

function alertSummary(ctx) {
  const R = ctx.rows, hit = R.filter(r => r.level !== '正常');
  return {
    total: hit.length,
    share: R.length ? hit.length / R.length : 0,
    exposure: sum(R.map(r => r.exposure)),
    by_level: LEVEL_ORDER.map(lv => {
      const s = hit.filter(r => r.level === lv);
      return { level: lv, count: s.length, spend: sum(s.map(r => r.spend)) };
    }),
    by_rule: RULES.map(([name, level, desc]) => {
      const s = R.filter(r => r.hit[name]);
      return { rule: name, level, desc, count: s.length, spend: sum(s.map(r => r.spend)) };
    }).sort((a, b) => b.count - a.count)
  };
}

function alertTrend(ctx) {
  const lo = MONTHS_ALL.indexOf(ctx.months[0]);
  const risky = ctx.rows.filter(r => r.level === '高危' || r.level === '中危');
  const healthy = ctx.rows.filter(r => !(r.level === '高危' || r.level === '中危'));
  const series = arr => ctx.months.map((_, i) => sum(arr.map(r => r.monthly[i])));
  return { months: ctx.months, risky: series(risky), healthy: series(healthy) };
}

const alertRow = r => ({
  id: r.m.id, name: r.m.name, industry: r.m.industry, region: r.m.region,
  tier: r.tier, level: r.level, rules: r.rules, spend: r.spend,
  last: r.last, prev1: r.prev1, trend: r.m.trendTxt, scene: r.m.scene,
  score: r.score, owner: r.m.owner, headroom: r.headroom,
  exposure: r.exposure, strategy: r.strategy
});

function alertList(ctx, level, rule, limit = 200) {
  let hit = ctx.rows.filter(r => r.level !== '正常');
  if (level) hit = hit.filter(r => r.level === level);
  if (rule) hit = hit.filter(r => r.hit[rule]);
  return hit.sort((a, b) => (b.exposure - a.exposure) || (b.spend - a.spend))
    .slice(0, limit).map(alertRow);
}

/* ---------------------------------------------------------------- M6 动作 */
const RULE_ACTION = {
  '连续下降': '拉取近3月场景级消耗明细做归因，48h 内约客户复盘会，出止跌方案',
  '消耗断崖': '当日电话触达确认是否停投/切竞品，同步预算与排期，必要时上报大区',
  '头部流失预警': '启动头部保级流程：商务+解决方案双人上门，谈续约与年框',
  '活跃衰减': '推送场景模板库，配 1 次运营陪跑，把活跃发送天数拉回 8 天以上',
  '场景收缩': '按分层策略补场景：优先 AI外呼（大促催付/复购召回），目标场景数 +2',
  '预算未消化': '带「可拓展预算空间」数据上门，做大促作战包报价，抢下半年预算',
  '沉默超期': '断约归因回访，给回签政策/首充补贴，不投专属人力'
};
const SLA_DAYS = { '高危': 2, '中危': 5, '关注': 10 };

function buildActions(ctx, level, owner, limit = 120) {
  let hit = ctx.rows.filter(r => r.level !== '正常');
  if (level) hit = hit.filter(r => r.level === level);
  if (owner) hit = hit.filter(r => r.m.owner === owner);
  hit = hit.sort((a, b) => (b.exposure - a.exposure) || (b.spend - a.spend)).slice(0, limit);

  const today = new Date();
  return hit.map(r => {
    const top = r.rules.slice().sort((a, b) => LEVEL_RANK[RULE_LEVEL[a]] - LEVEL_RANK[RULE_LEVEL[b]])[0];
    const due = new Date(today.getTime() + SLA_DAYS[r.level] * 864e5);
    return {
      action_id: `AC-${r.m.id.slice(2)}-${top.slice(0, 2)}`,
      merchant_id: r.m.id, merchant: r.m.name, tier: r.tier, level: r.level,
      rules: r.rules, top_rule: top, reason: RULE_DESC[top], action: RULE_ACTION[top],
      strategy: r.strategy, spend: r.spend, exposure: r.exposure, headroom: r.headroom,
      owner: r.m.owner, region: r.m.region, industry: r.m.industry,
      due: due.toISOString().slice(0, 10), status: '待跟进'
    };
  });
}

function ownerWorkload(ctx) {
  const g = new Map();
  for (const r of ctx.rows.filter(x => x.level !== '正常')) {
    const e = g.get(r.m.owner) || { owner: r.m.owner, tasks: 0, critical: 0, exposure: 0 };
    e.tasks++; e.exposure += r.exposure; if (r.level === '高危') e.critical++;
    g.set(r.m.owner, e);
  }
  return [...g.values()].sort((a, b) => b.exposure - a.exposure);
}

const LEVEL_TEMPLATE = { '高危': 'red', '中危': 'orange', '关注': 'yellow' };
const yuan = n => '¥' + Math.round(n).toLocaleString('en-US');

function feishuCard(actions, window) {
  if (!actions.length) return {};
  const lines = actions.slice(0, 10).map(a =>
    `**${a.merchant}**（${a.tier}·${a.region}）｜${a.top_rule}\n` +
    `区间消耗 ${yuan(a.spend)}｜风险敞口 ${yuan(a.exposure)}｜可拓展预算 ${yuan(a.headroom)}\n` +
    `建议动作：${a.action}\n负责人：${a.owner}｜截止 ${a.due}`);
  const more = actions.length > 10
    ? `\n\n> 另有 ${actions.length - 10} 条未展开，点击进入大屏查看完整清单。` : '';
  return {
    msg_type: 'interactive',
    card: {
      config: { wide_screen_mode: true },
      header: {
        template: LEVEL_TEMPLATE[actions[0].level] || 'blue',
        title: { tag: 'plain_text', content: `【商家运营预警】${actions.length} 条待跟进 · ${window}` }
      },
      elements: [
        { tag: 'div', text: { tag: 'lark_md', content: lines.join('\n\n---\n\n') + more } },
        { tag: 'hr' },
        { tag: 'note', elements: [{ tag: 'plain_text', content: 'QuickAudience 商家分层大屏自动推送' }] },
        { tag: 'action', actions: [{ tag: 'button', text: { tag: 'plain_text', content: '打开大屏' }, type: 'primary', url: '#alert' }] }
      ]
    }
  };
}

/* ---------------------------------------------------------------- api 契约 */
const DETAIL_SORT = {
  spend: r => r.spend, score: r => r.score, headroom: r => r.headroom,
  scene: r => r.m.scene, exposure: r => r.exposure
};
const PUSH_LOG = [];
const windowLabel = ctx => `${ctx.months[0]} ~ ${ctx.months[ctx.months.length - 1]}`;

function api(path, extra = {}) {
  const ctx = evaluateAlerts(buildCtx({
    start: state.start, end: state.end, rescore: state.rescore,
    filters: {
      industry: state.industry, region: state.region, source: state.source,
      contract: state.contract, tier: state.tier, strategic: state.strategic
    }
  }));

  let out;
  if (path === 'overview') {
    out = { kpi: kpi(ctx), trend: trendByChannel(ctx), tiers: tierSummary(ctx),
            lorenz: lorenz(ctx), industry: byDimension(ctx, 'industry'),
            region: byDimension(ctx, 'region') };
  } else if (path === 'tiering') {
    out = { tiers: tierSummary(ctx), quadrant: quadrant(ctx), matrix: tierIndustryMatrix(ctx),
            lifecycle: lifecycle(ctx), radar: tierRadar(ctx), migration: migration(ctx) };
  } else if (path === 'channel') {
    out = { summary: channelSummary(ctx), trend: trendByChannel(ctx), mix: tierChannelMix(ctx),
            penetration: tierChannelPenetration(ctx), scene: sceneDepth(ctx) };
  } else if (path === 'merchants') {
    let rows = ctx.rows;
    const q = (extra.q || '').trim();
    if (q) rows = rows.filter(r => r.m.name.includes(q) || r.m.id.toLowerCase().includes(q.toLowerCase()));
    if (extra.alert_only === '1') rows = rows.filter(r => r.level !== '正常');
    const key = DETAIL_SORT[extra.sort] || DETAIL_SORT.spend;
    rows = [...rows].sort((a, b) => key(b) - key(a));
    const page = Math.max(1, +extra.page || 1), size = Math.min(200, +extra.size || 30);
    out = {
      total: rows.length, page, size,
      rows: rows.slice((page - 1) * size, page * size).map(r => ({
        id: r.m.id, name: r.m.name, industry: r.m.industry, region: r.m.region,
        source: r.m.source, contract: r.m.contract, tier: r.tier, score: r.score,
        v: r.v, a: r.a, p: r.p, h: r.h, spend: r.spend,
        sms: r.cur[0], voice: r.cur[1], push: r.cur[2],
        scene: r.m.scene, depth: r.m.depth, trend: r.m.trendTxt,
        level: r.level, rules: r.rules, headroom: r.headroom, strategy: r.strategy,
        owner: r.m.owner, lifecycle: r.m.lifecycle, months: r.m.coop, strategic: r.m.strategic
      }))
    };
  } else if (path === 'alerts') {
    out = { summary: alertSummary(ctx), trend: alertTrend(ctx),
            list: alertList(ctx, extra.level, extra.rule) };
  } else if (path === 'actions') {
    const acts = buildActions(ctx, extra.level, extra.owner);
    out = { actions: acts, workload: ownerWorkload(ctx), history: PUSH_LOG,
            feishu_configured: false, preview: feishuCard(acts, windowLabel(ctx)) };
  }
  return Promise.resolve(out);
}

/* 网页版没有服务端，无法真的向飞书发 POST：这里生成与线上完全一致的报文并留痕，
   便于把卡片拷进飞书机器人调试台核对。Flask 版配置 FEISHU_WEBHOOK 后即为真实推送。 */
async function notify(ids, level, owner) {
  const ctx = evaluateAlerts(buildCtx({
    start: state.start, end: state.end, rescore: state.rescore,
    filters: { industry: state.industry, region: state.region, source: state.source,
               contract: state.contract, tier: state.tier, strategic: state.strategic }
  }));
  let acts = buildActions(ctx, level || '', owner || '', 200);
  if (ids && ids.length) acts = acts.filter(a => ids.includes(a.merchant_id));
  if (!acts.length) { toast('没有匹配的待办动作', true); return; }

  const card = feishuCard(acts, windowLabel(ctx));
  const recipients = [...new Set(acts.map(a => a.owner))].sort();
  PUSH_LOG.unshift({
    time: new Date().toLocaleString('zh-CN', { hour12: false }),
    recipients, note: `${acts.length} 条动作`, mode: '网页预览', ok: true,
    detail: '网页版无服务端，已生成报文未外发；Flask 版配置 FEISHU_WEBHOOK 后为真实推送'
  });
  PUSH_LOG.splice(50);
  showCard(card, acts.length, recipients);
  if (currentView === 'action') renderAction();
}

</script>
<script>

      <div class="chart tall" id="ovTrend"></div></div>

const kpiTile = (label, value, unit, foot) => `
  <div class="kpi"><div class="label">${label}</div>
    <div class="value">${value}<span class="unit">${unit}</span></div>
    <div class="foot">${foot}</div></div>`;

function tierTable(tiers) {
  return `<div class="tablewrap"><table>
    <thead><tr><th>层级</th><th class="num">家数</th><th class="num">家数占比</th>
      <th class="num">区间消耗</th><th class="num">消耗占比</th><th class="num">平均综合分</th>
      <th class="num">平均场景数</th><th>策略定性 / 通道动作</th></tr></thead>
    <tbody>${tiers.map(t => `<tr>
      <td>${tierSwatch(t.tier)}</td>
      <td class="num">${fmtInt(t.count)}</td><td class="num">${fmtPct(t.count_share)}</td>
      <td class="num">${fmtYuan(t.spend)}</td><td class="num">${fmtPct(t.spend_share)}</td>
      <td class="num">${t.avg_score.toFixed(1)}</td><td class="num">${t.avg_scene.toFixed(2)}</td>
      <td style="white-space:normal;color:var(--ink-2)">${esc(t.strategy)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function drawTrend(id, t, stacked) {
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: C.baseline } },
      valueFormatter: v => fmtYuan(v) },
    legend: { ...legendBase, data: t.series.map(s => s.name) },
    grid: stacked ? gridBase : { ...gridBase, right: 118 },
    xAxis: catAxis(t.months, { boundaryGap: !!stacked }),
    yAxis: moneyAxis(),
    series: t.series.map(s => ({
      name: s.name, type: stacked ? 'bar' : 'line', stack: stacked ? 'a' : undefined,
      data: s.data, ...(stacked ? BAR : {}),
      smooth: 0.3, symbol: 'circle', symbolSize: 8,
      lineStyle: { width: 2 }, showSymbol: !stacked,
      itemStyle: stacked ? { color: C.channel[s.name], ...STACK_GAP, borderRadius: 0 }
                         : { color: C.channel[s.name], borderColor: C.surface, borderWidth: 2 },
      endLabel: !stacked ? { show: true, color: C.ink2, fontSize: 11, distance: 6,
        formatter: p => `${p.seriesName} ${fmtMoney(p.value)}` } : undefined
    }))
  });
}

function drawPyramid(id, tiers) {
  const rows = tiers.slice().reverse();
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'item',
      formatter: p => `${p.name}<br/>家数 ${fmtInt(p.value)}（${fmtPct(rows[p.dataIndex].count_share)}）<br/>消耗 ${fmtYuan(rows[p.dataIndex].spend)}（${fmtPct(rows[p.dataIndex].spend_share)}）` },
    grid: { ...gridBase, top: 12, right: 132 },
    xAxis: { type: 'value', show: false },
    yAxis: catAxis(rows.map(r => r.tier), { axisLine: { show: false } }),
    series: [{
      type: 'bar', data: rows.map(r => ({ value: r.count, itemStyle: { color: C.tier[r.tier] } })),
      ...BAR_H,
      label: { show: true, position: 'right', color: C.ink2, fontSize: 11,
        formatter: p => `${fmtInt(p.value)} 家 · 消耗 ${fmtPct(rows[p.dataIndex].spend_share, 0)}` }
    }]
  });
}

function drawLorenz(id, lz) {
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'axis',
      formatter: p => `前 ${p[0].value[0]}% 商家<br/>累计贡献 ${p[0].value[1]}% 消耗` },
    grid: { ...gridBase, top: 16 },
    xAxis: { type: 'value', max: 100, name: '累计商家占比 %', nameLocation: 'middle', nameGap: 26,
      nameTextStyle: { color: C.ink3, fontSize: 11 }, axisLabel, axisLine: { show: false },
      axisTick: { show: false }, splitLine },
    yAxis: { type: 'value', max: 100, name: '累计消耗占比 %', axisLabel, axisLine: { show: false },
      axisTick: { show: false }, splitLine, nameTextStyle: { color: C.ink3, fontSize: 11 } },
    series: [
      { type: 'line', data: [[0, 0], [100, 100]], symbol: 'none',
        lineStyle: { color: C.baseline, width: 1 }, tooltip: { show: false }, silent: true },
      { type: 'line', data: lz.points, symbol: 'none', smooth: 0.2,
        lineStyle: { width: 2, color: C.tier.KA }, areaStyle: { color: C.tier.KA, opacity: 0.10 } }
    ]
  });
}

function drawDimBar(id, rows) {
  const el = document.getElementById(id);
  if (rows.length < 2) {
    el.style.height = 'auto';
    el.innerHTML = rows.length
      ? `<div style="padding:26px 2px"><div style="font-size:12px;color:var(--ink-3)">${esc(rows[0].name)}</div>
         <div style="font-size:26px;font-weight:650;margin-top:4px">${fmtYuan(rows[0].spend)}</div>
         <div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">${fmtInt(rows[0].count)} 家 · 当前筛选下仅此一个类目</div></div>`
      : '<div class="empty">当前筛选下没有数据</div>';
    return;
  }
  const data = rows.slice().reverse();
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'item',
      formatter: p => `${p.name}<br/>消耗 ${fmtYuan(p.value)}<br/>商家 ${fmtInt(data[p.dataIndex].count)} 家` },
    grid: { ...gridBase, top: 12, right: 66 },
    xAxis: { type: 'value', show: false },
    yAxis: catAxis(data.map(r => r.name), { axisLine: { show: false } }),
    series: [{
      type: 'bar', data: data.map(r => r.spend), ...BAR_H, itemStyle: { color: C.tier.KA, borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: 'right', color: C.ink2, fontSize: 11, formatter: p => fmtYuan(p.value) }
    }]
  });
}

/* ============================ M2 客户分层 ============================ */
async function renderTiering() {
  const box = document.getElementById('view-tiering');
  const d = await api('tiering');
  const q = d.quadrant.counts;

  box.innerHTML = `
    <div class="card c12"><h3>分层结构：家数 vs 消耗贡献 <span class="sub">上条为家数结构、下条为消耗结构，段内直接标注层级</span></h3>
      <div class="chart short" id="tiStruct"></div>
      <div class="legend">${d.tiers.map(t => `<span><i style="background:${C.tier[t.tier]}"></i>${t.tier}</span>`).join('')}</div></div>

    <div class="card c7"><h3>价值 × 潜力 四象限 <span class="sub">气泡大小 = 区间消耗；${q['高潜新签']} 家高潜新签、${q['衰退KA']} 家衰退KA 已单独标注</span></h3>
      <div class="chart tall" id="tiQuad"></div>
      <p class="note">象限口径：价值分 ≥20（40 分制中位）为高价值，潜力分 ≥21（30 分制 70%）为高潜力。右上=核心经营、右下=培育成长、左上=成熟守护、左下=自助长尾。</p></div>

    <div class="card c5"><h3>各层四维能力 <span class="sub">价值 / 活跃 / 潜力 / 健康 平均分</span></h3>
      <div class="chart tall" id="tiRadar"></div></div>

    <div class="card c7"><h3>分层 × 行业 分布 <span class="sub">单位：家</span></h3>
      <div class="chart" id="tiMatrix"></div></div>

    <div class="card c5"><h3>生命周期阶段分布</h3>
      <div class="chart" id="tiLife"></div></div>

    <div class="card c12"><h3>升降级候选 <span class="sub">区间分层 vs 年度基准分层不一致的商家（按打分卡：连续 2 个周期跨档才执行升降级）</span></h3>
      ${migrationTable(d.migration)}</div>`;

  drawTierStruct('tiStruct', d.tiers);
  drawQuadrant('tiQuad', d.quadrant);
  drawRadar('tiRadar', d.radar);
  drawMatrix('tiMatrix', d.matrix);
  drawLifecycle('tiLife', d.lifecycle);
}

function drawTierStruct(id, tiers) {
  const rows = [{ key: '消耗结构', f: t => t.spend_share }, { key: '家数结构', f: t => t.count_share }];
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'item', formatter: p => `${p.seriesName}<br/>${p.name} ${p.value.toFixed(1)}%` },
    grid: { ...gridBase, top: 10, left: 8 },
    xAxis: { type: 'value', max: 100, show: false },
    yAxis: catAxis(rows.map(r => r.key), { axisLine: { show: false } }),
    series: tiers.map(t => ({
      name: t.tier, type: 'bar', stack: 's', barMaxWidth: 34,
      data: rows.map(r => +(r.f(t) * 100).toFixed(1)),
      itemStyle: { color: C.tier[t.tier], ...STACK_GAP },
      label: {
        show: true, color: '#0d1016', fontSize: 11, fontWeight: 600,
        // 段太窄放不下就不画标签，绝不裁字
        formatter: p => (p.value >= 9 ? `${t.tier} ${p.value.toFixed(0)}%` : p.value >= 4 ? `${p.value.toFixed(0)}%` : '')
      }
    }))
  });
}

function drawQuadrant(id, qd) {
  const style = {
    '常规': { color: C.tier.KA, opacity: 0.5, symbol: 'circle' },
    '高潜新签': { color: C.status.关注, opacity: 0.95, symbol: 'triangle' },
    '衰退KA': { color: C.status.高危, opacity: 0.95, symbol: 'diamond' }
  };
  const maxSpend = Math.max(1, ...Object.values(qd.groups).flat().map(p => p[2]));
  chart(id, {
    tooltip: {
      ...tooltipBase, trigger: 'item',
      formatter: p => `${esc(p.value[3])}（${p.value[4]}）<br/>潜力分 ${p.value[0]}｜价值分 ${p.value[1]}<br/>区间消耗 ${fmtYuan(p.value[2])}<br/><span style="color:#868d9c">${p.seriesName}</span>`
    },
    legend: { ...legendBase, data: Object.keys(qd.groups) },
    grid: { ...gridBase, top: 36, right: 24, bottom: 26 },
    xAxis: { type: 'value', name: '潜力分 (0-30)', min: 0, max: 30, nameLocation: 'middle', nameGap: 28,
      nameTextStyle: { color: C.ink3, fontSize: 11 },
      axisLabel, axisLine: { show: false }, axisTick: { show: false }, splitLine },
    yAxis: { type: 'value', name: '价值分 (0-40)', min: 0, max: 40, nameTextStyle: { color: C.ink3, fontSize: 11 },
      axisLabel, axisLine: { show: false }, axisTick: { show: false }, splitLine },
    series: Object.entries(qd.groups).map(([name, pts], i) => ({
      name, type: 'scatter', data: pts, symbol: style[name].symbol,
      symbolSize: v => 6 + 22 * Math.sqrt(v[2] / maxSpend),
      itemStyle: { color: style[name].color, opacity: style[name].opacity,
        borderColor: C.surface, borderWidth: name === '常规' ? 0 : 2 },
      z: i + 2,
      // 象限分割线直接标注阈值；象限名写在图下说明里，避免文字压在气泡上
      markLine: i === 0 ? {
        silent: true, symbol: 'none',
        lineStyle: { color: C.baseline, width: 1 },
        label: { color: C.ink3, fontSize: 10.5, formatter: p => p.name },
        data: [{ xAxis: 21, name: '高潜力线 21', label: { position: 'insideEndTop' } },
               { yAxis: 20, name: '高价值线 20', label: { position: 'insideStartTop' } }]
      } : undefined
    }))
  });
}

function drawRadar(id, rows) {
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'item' },
    legend: { ...legendBase, data: rows.map(r => r.tier), top: 'auto', bottom: 0, right: 'auto', left: 'center' },
    radar: {
      indicator: [{ name: '价值', max: 40 }, { name: '活跃', max: 20 },
                  { name: '潜力', max: 30 }, { name: '健康', max: 10 }],
      radius: '62%', center: ['50%', '47%'],
      axisName: { color: C.ink2, fontSize: 11.5 },
      splitLine: { lineStyle: { color: C.line } },
      splitArea: { areaStyle: { color: ['rgba(255,255,255,0.012)', 'transparent'] } },
      axisLine: { lineStyle: { color: C.line } }
    },
    series: [{
      type: 'radar', symbolSize: 5,
      data: rows.map(r => ({
        name: r.tier, value: r.value,
        lineStyle: { width: 2, color: C.tier[r.tier] },
        itemStyle: { color: C.tier[r.tier] },
        areaStyle: { color: C.tier[r.tier], opacity: 0.10 }
      }))
    }]
  });
}

function drawMatrix(id, m) {
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'item',
      formatter: p => `${m.tiers[p.value[1]]} × ${m.industries[p.value[0]]}<br/>${fmtInt(p.value[2])} 家` },
    grid: { ...gridBase, top: 10, bottom: 26, right: 60 },
    xAxis: catAxis(m.industries, { splitArea: { show: false }, axisLabel: { ...axisLabel, interval: 0, rotate: 0 } }),
    yAxis: catAxis(m.tiers.slice().reverse(), { axisLine: { show: false } }),
    visualMap: {
      min: 0, max: m.max, calculable: false, orient: 'vertical', right: 0, top: 'middle',
      itemHeight: 110, itemWidth: 10, textStyle: { color: C.ink3, fontSize: 10.5 },
      inRange: { color: C.seq.slice(0, 6) }
    },
    series: [{
      type: 'heatmap',
      data: m.data.map(([x, y, v]) => [x, m.tiers.length - 1 - y, v]),
      label: { show: true, color: '#0b1016', fontSize: 10.5, fontWeight: 600,
        formatter: p => (p.value[2] ? p.value[2] : '') },
      itemStyle: { borderColor: C.surface, borderWidth: 2, borderRadius: 3 }
    }]
  });
}

function drawLifecycle(id, rows) {
  chart(id, {
    tooltip: { ...tooltipBase, trigger: 'item',
      formatter: p => `${p.name}<br/>${fmtInt(p.value)} 家<br/>消耗 ${fmtYuan(rows[p.dataIndex].spend)}` },
    grid: { ...gridBase, top: 12, right: 60 },
    xAxis: { type: 'value', show: false },
    yAxis: catAxis(rows.map(r => r.name).reverse(), { axisLine: { show: false } }),
    series: [{
      type: 'bar', data: rows.map(r => r.count).reverse(), ...BAR_H,
      itemStyle: { color: C.tier.腰部, borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: 'right', color: C.ink2, fontSize: 11, formatter: p => `${fmtInt(p.value)} 家` }
    }]
  });
}

function migrationTable(rows) {
  if (!rows.length) return `<div class="empty">当前窗口下没有与年度基准不一致的分层结果。</div>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th>商家</th><th>行业动作</th><th>年度基准层</th><th>区间层</th>
      <th class="num">基准分</th><th class="num">区间分</th><th class="num">区间消耗</th><th>负责销售</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.name)} <span class="tag">${r.id}</span></td>
      <td>${r.direction === '升级'
            ? '<span class="pill lv-正常">↑ 升级候选</span>'
            : '<span class="pill lv-高危">↓ 降级预警</span>'}</td>
      <td>${tierSwatch(r.from)}</td><td>${tierSwatch(r.to)}</td>
      <td class="num">${r.base_score.toFixed(1)}</td><td class="num">${r.score.toFixed(1)}</td>
      <td class="num">${fmtYuan(r.spend)}</td><td>${esc(r.owner)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ============================ M3 产品/通道消耗 ============================ */
async function renderChannel() {
  const box = document.getElementById('view-channel');
  const d = await api('channel');

  box.innerHTML = `
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      ${d.summary.map((c, i) => `
        <div class="kpi"><div class="label"><span class="swatch" style="background:${C.channel[c.channel]}"></span>${c.channel} 消耗</div>
          <div class="value">${fmtYuan(c.spend)}</div>
          <div class="foot">${deltaHtml(c.delta)}<span>占比 ${fmtPct(c.share)}</span>
            <span>ARPU ${fmtYuan(c.arpu)}</span><span>渗透 ${fmtPct(c.penetration)}</span></div>
          ${c.trend.length >= 4 ? `<div class="spark" id="chSpark${i}"></div>` : ''}</div>`).join('')}
    </div>

    <div class="card c8"><h3>三通道月度趋势 <span class="sub">端点直接标值</span></h3>
      <div class="chart tall" id="chTrend"></div></div>

    <div class="card c4"><h3>通道消耗结构</h3>
      <div class="chart tall" id="chDonut"></div></div>

    <div class="card c6"><h3>分层 × 通道消耗结构 <span class="sub">每层内部占比 %</span></h3>
      <div class="chart" id="chMix"></div>
      <p class="note">各层通道结构高度一致（短信≈56%/外呼≈29%/Push企微≈15%）——层间差距不在「用哪个通道」，而在「用了几个场景」。</p></div>

    <div class="card c6"><h3>分层 × 通道渗透率 <span class="sub">该层中使用过该通道的商家占比 %</span></h3>
      <div class="chart" id="chPen"></div>
      <p class="note">有消耗的商家三通道基本全覆盖，渗透率的差异主要出现在「新客观察期 / 未激活」两层——通道不是问题，激活才是。</p></div>

    <div class="card c12"><h3>场景与数据接入渗透 <span class="sub">各层平均触达场景数（0-6）与数据接入深度（0-3）</span></h3>
      <div class="chart short" id="chScene"></div></div>`;

  d.summary.forEach((c, i) => { if (c.trend.length >= 4) chart('chSpark' + i, sparkOption(c.trend, C.channel[c.channel])); });
  drawTrend('chTrend', d.trend, false);
  drawDonut('chDonut', d.summary);
  drawMix('chMix', d.mix);
  drawPenetration('chPen', d.penetration);
  drawScene('chScene', d.scene);
}

function drawDonut(id, rows) {
  const total = rows.reduce((s, r) => s + r.spend, 0);
  chart(id, {
    title: {
      text: fmtYuan(total), subtext: '区间通道消耗合计',
      left: 'center', top: '40%', textAlign: 'center',
      textStyle: { color: C.ink, fontSize: 21, fontWeight: 600 },
      subtextStyle: { color: C.ink3, fontSize: 11 }
    },
    tooltip: { ...tooltipBase, trigger: 'item', formatter: p => `${p.name}<br/>${fmtYuan(p.value)}（${p.percent}%）` },
    legend: { ...legendBase, bottom: 0, top: 'auto', left: 'center', right: 'auto' },

let currentView = 'overview';

async function render() {
  const box = document.getElementById('view-' + currentView);
  box.classList.add('loading');
  try { await VIEWS[currentView](); }
  catch (e) { box.innerHTML = `<div class="card c12"><div class="empty">加载失败：${esc(e.message)}</div></div>`; }

}

}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(el => { el.hidden = el.id !== 'view-' + v; });
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* 内嵌环境可能禁止改地址栏 */ }
  render();
}

function setRange(n) {
  const ms = META.months;
  state.start = n >= ms.length ? null : ms[ms.length - n];
  state.end = null;
  document.getElementById('startSel').value = state.start || ms[0];
  document.getElementById('endSel').value = ms[ms.length - 1];
  updateHint();
}

function updateHint() {
  const ms = META.months;
  const s = state.start || ms[0], e = state.end || ms[ms.length - 1];
  const n = ms.filter(m => m >= s && m <= e).length;
  document.getElementById('windowHint').innerHTML =
    `统计窗口 <b>${s} ~ ${e}</b>（${n} 个月）· 分层口径：${state.rescore === '1' ? '按窗口重算' : '年度基准'}`;
}

function fillSelect(el, values, multi) {
  el.innerHTML = (multi ? '' : '<option value="">全部</option>') +
    values.map(v => `<option value="${v}">${v}</option>`).join('');
  if (multi) el.size = Math.min(4, values.length);
}

async function boot() {
  META = QA_DATA.meta;
  const ms = META.months;
  ['startSel', 'endSel'].forEach(id => {
    document.getElementById(id).innerHTML = ms.map(m => `<option value="${m}">${m}</option>`).join('');
  });
  document.getElementById('startSel').value = ms[0];
  document.getElementById('endSel').value = ms[ms.length - 1];

  fillSelect(document.getElementById('industrySel'), META.industries, true);
  fillSelect(document.getElementById('regionSel'), META.regions, true);
  fillSelect(document.getElementById('sourceSel'), META.sources);
  fillSelect(document.getElementById('contractSel'), META.contracts);
  fillSelect(document.getElementById('tierSel'), META.tiers);

  document.getElementById('rangeChips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#rangeChips .chip').forEach(c => c.classList.toggle('on', c === b));
    setRange(+b.dataset.n); render();
  });
  document.getElementById('rescoreChips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('#rescoreChips .chip').forEach(c => c.classList.toggle('on', c === b));
    state.rescore = b.dataset.v; updateHint(); render();
  });
  const onMonth = () => {
    state.start = document.getElementById('startSel').value;
    state.end = document.getElementById('endSel').value;
    document.querySelectorAll('#rangeChips .chip').forEach(c => c.classList.remove('on'));
    updateHint(); render();
  };
  document.getElementById('startSel').addEventListener('change', onMonth);
  document.getElementById('endSel').addEventListener('change', onMonth);

  const multi = (id, key) => document.getElementById(id).addEventListener('change', e => {
    state[key] = [...e.target.selectedOptions].map(o => o.value); state.detailPage = 1; render();
  });
  multi('industrySel', 'industry'); multi('regionSel', 'region');
  ['sourceSel:source', 'contractSel:contract', 'tierSel:tier', 'strategicSel:strategic'].forEach(pair => {
    const [id, key] = pair.split(':');
    document.getElementById(id).addEventListener('change', e => {
      state[key] = e.target.value; state.detailPage = 1; render();
    });
  });
  document.getElementById('resetBtn').addEventListener('click', () => location.reload());

  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (b) switchView(b.dataset.view);
  });

  updateHint();
  let hash = '';
  try { hash = location.hash.slice(1); } catch (e) { /* 同上 */ }
  switchView(VIEWS[hash] ? hash : 'overview');
}

boot();

</script>
